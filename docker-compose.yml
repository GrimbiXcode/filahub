# Deployment template for filahub (app + PostgreSQL).
#
# Usage:
#   1. cp .env.example .env  and fill in APP_SECRET + Telegram values
#      (DATABASE_URL in .env is overridden below and can be ignored here)
#   2. Set a strong DB password in both places marked "change-me"
#   3. docker compose up -d
#
# The app applies pending DB migrations automatically on startup
# (db/migrations) – no manual schema step is needed.
# Put a reverse proxy with HTTPS (e.g. Caddy) in front of port 3000.
# The session cookie requires HTTPS outside of localhost.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: filahub
      POSTGRES_USER: filahub
      POSTGRES_PASSWORD: change-me
    volumes:
      - db-data:/var/lib/postgresql/data
    # Bound to localhost only: lets you run `npm run db:push` from the host
    # (schema migrations) without exposing Postgres to the network.
    ports:
      - "127.0.0.1:5432:5432"
    # `pg_isready` mit Benutzer und Datenbank statt eines nackten Ports: Der
    # temporäre Server während der Initialisierung lauscht nur auf dem
    # Unix-Socket. So meldet der Check erst "healthy", wenn die App sich
    # tatsächlich anmelden kann.
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ghcr.io/grimbixcode/filahub:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Points the app at the db service; overrides DATABASE_URL from .env.
      # The password must match POSTGRES_PASSWORD above.
      DATABASE_URL: postgres://filahub:change-me@db:5432/filahub
    ports:
      - "3000:3000"
    # The image also ships a Dockerfile HEALTHCHECK; this entry makes the
    # status explicit for Compose (e.g. for monitoring via `docker compose ps`).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
