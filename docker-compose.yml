# Deployment template for filahub (app + MySQL).
#
# Usage:
#   1. cp .env.example .env  and fill in APP_SECRET + Telegram values
#      (DATABASE_URL in .env is overridden below and can be ignored here)
#   2. Set a strong DB password in both places marked "change-me"
#   3. docker compose up -d
#
# The app applies pending DB migrations automatically on startup
# (db/migrations) – no manual schema step is needed.
# Put a reverse proxy with HTTPS (e.g. Caddy) in front of port 3000.
# The session cookie requires HTTPS outside of localhost.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: filahub
      MYSQL_USER: filahub
      MYSQL_PASSWORD: change-me
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    # Bound to localhost only: lets you run `npm run db:push` from the host
    # (schema migrations) without exposing MySQL to the network.
    ports:
      - "127.0.0.1:3306:3306"
    # Echte Abfrage als Anwendungsbenutzer statt `mysqladmin ping`:
    #   - `ping` liefert auch bei "Access denied" den Exit-Code 0 und
    #   - erreicht über `-h localhost` den Unix-Socket, den schon der
    #     temporäre Server während der Initialisierung anlegt.
    # Beides zusammen meldet "healthy", bevor die App sich anmelden kann.
    # `-h 127.0.0.1` erzwingt TCP (erst nach der Initialisierung offen) und
    # prüft zusätzlich Zugangsdaten und Existenz der Datenbank.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysql -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD" -e "SELECT 1" "$$MYSQL_DATABASE" >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ghcr.io/grimbixcode/filahub:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Points the app at the db service; overrides DATABASE_URL from .env.
      # The password must match MYSQL_PASSWORD above.
      DATABASE_URL: mysql://filahub:change-me@db:3306/filahub
    ports:
      - "3000:3000"
    # The image also ships a Dockerfile HEALTHCHECK; this entry makes the
    # status explicit for Compose (e.g. for monitoring via `docker compose ps`).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
