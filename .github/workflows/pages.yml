name: Deploy landing page

# Veröffentlicht `landing/` als GitHub Pages. Einmalig nötig:
# Settings -> Pages -> Source auf "GitHub Actions" stellen.

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen, aber nur eines gleichzeitig
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Kein `enablement: true`: Das Workflow-Token darf keine Pages-Site
      # anlegen ("Resource not accessible by integration"). Die Einrichtung
      # bleibt ein einmaliger Handgriff, siehe Kommentar oben.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing

      - id: deployment
        uses: actions/deploy-pages@v4
