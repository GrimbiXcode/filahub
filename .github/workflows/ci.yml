name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nur lesen. Kein Schritt hier schreibt etwas zurück.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Dieselbe Postgres-Version wie in docker-compose.yml.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: filahub_test
          POSTGRES_USER: filahub
          POSTGRES_PASSWORD: filahub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U filahub -d filahub_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Schlägt fehl, wenn eine Datei nicht formatiert ist – `npm run format`
      # bringt sie in Ordnung. Ausnahmen stehen in .prettierignore.
      - name: Formatierung
        run: npm run format:check

      - name: TypeScript
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Integration tests (PostgreSQL)
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://filahub:filahub@127.0.0.1:5432/filahub_test

      # Nur Produktionsabhängigkeiten: Was in der Entwicklung liegt, landet
      # nicht im Abbild und ist oft monatelang nicht behebbar – als Gate wäre
      # das Rauschen, das man irgendwann abschaltet.
      #
      # Schwelle "high": Ein bekannter moderater Befund bleibt offen
      # (@hono/node-server, Pfad-Traversal nur unter Windows; die Behebung
      # wäre ein Hauptversionssprung des HTTP-Servers). Begründung steht in
      # COMPLIANCE.md.
      - name: Schwachstellen in Produktionsabhängigkeiten
        run: npm audit --omit=dev --audit-level=high
