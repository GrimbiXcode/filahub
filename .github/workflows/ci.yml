name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nur lesen. Kein Schritt hier schreibt etwas zurück.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Dieselbe Postgres-Version wie in docker-compose.yml.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: filahub_test
          POSTGRES_USER: filahub
          POSTGRES_PASSWORD: filahub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U filahub -d filahub_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Schlägt fehl, wenn eine Datei nicht formatiert ist – `npm run format`
      # bringt sie in Ordnung. Ausnahmen stehen in .prettierignore.
      - name: Formatierung
        run: npm run format:check

      - name: TypeScript
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Integration tests (PostgreSQL)
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://filahub:filahub@127.0.0.1:5432/filahub_test

      # Nur Produktionsabhängigkeiten: Was in der Entwicklung liegt, landet
      # nicht im Abbild und ist oft monatelang nicht behebbar – als Gate wäre
      # das Rauschen, das man irgendwann abschaltet.
      #
      # Schwelle "high": Die verbliebenen moderaten Befunde stecken in
      # Entwicklungswerkzeugen (@hono/vite-dev-server, drizzle-kit) und haben
      # upstream keine behobene Fassung. Begründung steht in
      # COMPLIANCE.md.
      - name: Schwachstellen in Produktionsabhängigkeiten
        run: npm audit --omit=dev --audit-level=high
