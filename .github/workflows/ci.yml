name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nur lesen. Kein Schritt hier schreibt etwas zurück.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Dieselbe Postgres-Version wie in docker-compose.yml.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: filahub_test
          POSTGRES_USER: filahub
          POSTGRES_PASSWORD: filahub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U filahub -d filahub_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

      # Quelle für den Test der Datenübernahme: Bestandsinstallationen kommen
      # von MySQL 8.4, also wird auch dagegen geprüft. Ohne diesen Dienst
      # überspringt sich api/legacyImport.integration.test.ts selbst – dann
      # wäre die Übernahme ungetestet.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: filahub_legacy
          MYSQL_USER: filahub
          MYSQL_PASSWORD: filahub
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql -h 127.0.0.1 -u filahub -pfilahub -e 'SELECT 1' filahub_legacy"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Schlägt fehl, wenn eine Datei nicht formatiert ist – `npm run format`
      # bringt sie in Ordnung. Ausnahmen stehen in .prettierignore.
      - name: Formatierung
        run: npm run format:check

      - name: TypeScript
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Integration tests (PostgreSQL)
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://filahub:filahub@127.0.0.1:5432/filahub_test
          TEST_LEGACY_MYSQL_URL: mysql://filahub:filahub@127.0.0.1:3306/filahub_legacy

      # Nur Produktionsabhängigkeiten: Was in der Entwicklung liegt, landet
      # nicht im Abbild und ist oft monatelang nicht behebbar – als Gate wäre
      # das Rauschen, das man irgendwann abschaltet.
      #
      # Schwelle "high": Ein bekannter moderater Befund bleibt offen
      # (@hono/node-server, Pfad-Traversal nur unter Windows; die Behebung
      # wäre ein Hauptversionssprung des HTTP-Servers). Begründung steht in
      # COMPLIANCE.md.
      - name: Schwachstellen in Produktionsabhängigkeiten
        run: npm audit --omit=dev --audit-level=high
