name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Dieselbe MySQL-Version wie in docker-compose.yml. MariaDB verhält sich
    # bei JSON-Spalten, Kollation und sql_mode anders – deshalb wird hier
    # bewusst gegen MySQL getestet.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: filahub_test
          MYSQL_USER: filahub
          MYSQL_PASSWORD: filahub
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql -h 127.0.0.1 -u filahub -pfilahub -e 'SELECT 1' filahub_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Schlägt fehl, wenn eine Datei nicht formatiert ist – `npm run format`
      # bringt sie in Ordnung. Ausnahmen stehen in .prettierignore.
      - name: Formatierung
        run: npm run format:check

      - name: TypeScript
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Integration tests (MySQL)
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: mysql://filahub:filahub@127.0.0.1:3306/filahub_test
