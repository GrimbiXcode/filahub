name: Docker Build Check

on:
  push:
    branches: [main]
  # Auch auf Pull Requests: Lief der Bau nur auf main, zeigte sich ein
  # kaputtes Dockerfile erst nach dem Merge – also genau dann, wenn main
  # nicht mehr veröffentlichbar ist.
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: filahub:check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prüft das Abbild, das ausgeliefert würde – nicht den Arbeitsbaum.
      # `ignore-unfixed`: Was noch keine Behebung hat, kann niemand beheben;
      # als Gate wäre es nur ein rotes Kreuz ohne Handlungsmöglichkeit. Die
      # Tabelle im Protokoll listet solche Befunde trotzdem auf.
      - name: Abbild auf Schwachstellen prüfen
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: filahub:check
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      # Zeigt, dass der Container nicht als root läuft. Eine Zeile, die
      # verhindert, dass ein späteres `USER root` unbemerkt durchrutscht.
      - name: Nicht-root prüfen
        run: |
          user=$(docker run --rm --entrypoint sh filahub:check -c 'id -un')
          echo "Container läuft als: $user"
          test "$user" = "node"
