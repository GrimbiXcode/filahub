name: Docker Release

on:
  push:
    tags: ["v*"]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/filahub

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Für actions/attest-build-provenance: `id-token` holt das
      # OIDC-Token, mit dem Sigstore signiert, `attestations` schreibt das
      # Ergebnis an das Abbild.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Stückliste der npm-Abhängigkeiten im CycloneDX-Format.
      #
      # Formal schuldet ein nicht-kommerzielles Projekt das nicht (siehe
      # COMPLIANCE.md). Wer filahub aber gewerblich einsetzt, wird selbst
      # zum Hersteller im Sinne des Cyber Resilience Act und braucht dann
      # genau diese Liste – bereitzustellen kostet hier einen Schritt.
      - name: SBOM erzeugen (npm)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@latest \
            --omit dev \
            --output-format JSON \
            --output-file sbom.cdx.json
          echo "Komponenten: $(node -e "console.log(require('./sbom.cdx.json').components.length)")"

      - name: SBOM als Artefakt ablegen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Hängt Stückliste und Herkunftsnachweis an das Abbild selbst.
          # Abrufbar mit:
          #   docker buildx imagetools inspect ghcr.io/…/filahub:latest \
          #     --format '{{ json .SBOM }}'
          sbom: true
          provenance: mode=max

      # Zusätzlich zur BuildKit-Provenance oben: Diese Bescheinigung wird von
      # Sigstore signiert und in ein öffentliches Transparenzprotokoll
      # geschrieben. Erst damit lässt sich von außen prüfen, dass genau
      # dieses Abbild aus genau diesem Repository stammt:
      #   gh attestation verify oci://ghcr.io/…/filahub:latest \
      #     --repo GrimbiXcode/filahub
      - name: Herkunftsnachweis erzeugen
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
