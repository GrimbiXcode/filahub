<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <title>filahub</title>

    <!--
      Icons liegen als Dateien in `public/`, nicht mehr als Data-URI: iOS liest
      für den Home-Screen ausschließlich `apple-touch-icon` und akzeptiert dort
      nur PNG. Ohne diese Zeile rendert das iPhone einen Screenshot der Seite
      als Kachel statt des Logos.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="filahub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      /*
        Farbschema vor dem ersten Paint setzen, sonst blitzt beim Laden im
        Dark-Mode kurz die helle Oberfläche auf. Schlüssel und Werte sind
        dieselben wie in next-themes (siehe src/providers/theme.tsx).
      */
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          var dark = stored === "dark" || (stored !== "light" && prefersDark);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#09090b" : "#ffffff");
        } catch (e) {
          /* localStorage kann blockiert sein – dann bleibt es hell */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
